services:
  db:
    image: pgvector/pgvector:pg16
    container_name: docustream_db
    environment:
      POSTGRES_USER: docustream_user
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: docustream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
